baseURL = 'https://blog.sanfuyee.me/'
languageCode = 'en-us'
title = 'Sanfuyee'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

[params]
env = 'production'
title = 'Sanfuyee'
description = 'Personal blog'
keywords = ['Blog', 'Portfolio', 'Hugo', 'PaperMod']
author = 'Sanfuyee'
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false

[params.homeInfoParams]
Title = 'Sanfuyee'
Content = 'Notes, projects, and writing.'

[[menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/posts/'
weight = 10

[[menu.main]]
identifier = 'archives'
name = 'Archives'
url = '/archives/'
weight = 20

[[menu.main]]
identifier = 'tags'
name = 'Tags'
url = '/tags/'
weight = 30
